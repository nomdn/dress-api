name: Build and Deploy to Netlify

on:
  push:
    branches: ['main']
    paths:
      - 'dress-api-docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 进入子目录并构建
      - name: Build VitePress Site
        run: |
          cd dress-api-docs
          npm install
          npm run docs:build
      
      - name: List Files
        run: |
          ls -lh dress-api-docs/docs/.vitepress/dist

      # 部署时指定相对于仓库根目录的完整路径
      - name: Deploy to EdgeOne Pages
        uses: TencentEdgeOne/edgeone-pages-action@v1
        with:
          token: ${{ secrets.EDGEONE_API_TOKEN }}
          project-name: "dress-api-docs"
          build-path: "dress-api-docs/docs/.vitepress/dist"  # 👈 关键：从根目录开始的路径